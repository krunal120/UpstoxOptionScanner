services:
  - type: web
    name: niftyquant-scanner
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: DatabaseProvider
        value: Sqlite
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=niftyquant.db
      - key: Upstox__AccessToken
        sync: false
      - key: MegaBull__ApiKey
        value: 453afc9b-2766-4e76-9ef2-db1fca69b5bb
      - key: MegaBull__IsEnabled
        value: "true"
